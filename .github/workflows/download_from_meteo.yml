name: download_from_meteo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  download_from_meteo:
    runs-on: macos-latest
    env:
      # Keep Data.DIR_REPO aligned with the copy step on macOS.
      TMPDIR: /tmp

    steps:
      - uses: actions/checkout@v2

      - name: Check Meteo connectivity
        run: |
          curl --fail --show-error --silent --location \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 10 \
            --output /dev/null https://meteo.gov.lk/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install dependencies
        run: |
          brew install ghostscript
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install build

      - name: Run workflows/download_from_meteo.py
        run: |
          export PYTHONPATH="$PYTHONPATH:./src"
          python workflows/download_from_meteo.py

      - name: Checkout repo branch data
        uses: actions/checkout@v2
        with:
          ref: "data"
          token: "${{ secrets.REPO_DATA_TOKEN }}"

      - name: Copy data, and push to repo branch data
        run: |
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          git pull origin data
          cp -r /tmp/weather_lk/* .
          echo "* $(date) download_from_meteo" >> update.log
          git add .
          git commit -m "🤖 $(date) - download_from_meteo.yml"
          git push origin data
